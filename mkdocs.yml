# Website settings. Replace the CAPITALIZED placeholders.
site_name: PROJECT NAME
site_description: One-line description of the project.
site_author: YOUR NAME
site_url: https://ORG-NAME.github.io/REPO-NAME/
repo_url: https://github.com/ORG-NAME/REPO-NAME
edit_uri: edit/main/docs/
copyright: >
  Hardware CERN-OHL-W-2.0 · Docs CC BY-SA 4.0 ·
  Made at the <a href="https://ORG-NAME.github.io/">Mars College Dept of Makers</a>

# Page order in the left-hand menu (and in the PDF).
nav:
  - Overview: index.md
  - Bill of materials: bom.md
  - Assembly: assembly.md
  - Operation: operation.md
  - Design notes: design-notes.md
  - Journal: journal.md

# ---- Shared Dept of Makers styling. Makers shouldn't need to edit below here. ----
theme:
  name: material
  font:
    text: Source Sans 3
    code: Source Code Pro
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.top
    - navigation.footer
    - content.action.edit
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/makers.css

plugins:
  - search
  - table-reader:
      data_path: "."

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
