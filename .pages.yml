# Pages CMS configuration for mars-doom/shower-pods
# Edit at https://app.pagescms.org  ·  Docs: https://pagescms.org/docs/configuration/

# ---- Where uploads go ----
media:
  # Photos for docs pages: saved to docs/images/, written into pages as images/name.jpg
  - name: images
    label: Photos and diagrams
    input: docs/images
    output: images
    rename: safe
    extensions: [jpg, jpeg, png, webp, svg, gif]

  # README sits at the repo root, so its image links need docs/images/name.jpg
  - name: readme_images
    label: Photos (README)
    input: docs/images
    output: docs/images
    rename: safe
    extensions: [jpg, jpeg, png, webp, svg, gif]

  - name: cad_source
    label: CAD source files
    input: cad/source
    output: cad/source

  - name: cad_exports
    label: CAD exports (STEP, DXF, PDF, STL)
    input: cad/exports
    output: cad/exports

  - name: testing
    label: Test data
    input: testing
    output: testing

# ---- What can be edited ----
content:
  # All Markdown files open in a plain Markdown editor: no frontmatter needed, and
  # MkDocs callouts, tables and image links are saved exactly as typed.
  # To add a photo: upload it under Media, then type ![description](images/name.jpg)
  # (README uses docs/images/name.jpg).

  # The journal is the most-edited page, so it sits at the top of the sidebar.
  - name: journal
    label: Journal
    type: file
    path: docs/journal.md
    format: code
    operations: { delete: false }

  - name: docs
    label: Documentation
    type: group
    items:
      - name: overview
        label: Overview
        type: file
        path: docs/index.md
        format: code
        operations: { delete: false }

      - name: design_notes
        label: Design notes
        type: file
        path: docs/design-notes.md
        format: code
        operations: { delete: false }

      - name: assembly
        label: Assembly guide
        type: file
        path: docs/assembly.md
        format: code
        operations: { delete: false }

      - name: operation
        label: Operation and maintenance
        type: file
        path: docs/operation.md
        format: code
        operations: { delete: false }

  # Spreadsheet editor. The website's BOM page is generated from this file.
  - name: bom
    label: Bill of materials
    type: file
    path: BOM.csv
    format: datagrid
    operations: { delete: false }

  - name: readme
    label: Project front page (README)
    type: file
    path: README.md
    format: code
    operations: { delete: false }

  - name: changelog
    label: Changelog
    type: file
    path: CHANGELOG.md
    format: code
    operations: { delete: false }

  - name: advanced
    label: Advanced
    type: group
    items:
      - name: site_config
        label: Website settings (mkdocs.yml)
        type: file
        path: mkdocs.yml
        format: code
        operations: { delete: false }

      - name: cad_index
        label: Design files index (cad/README.md)
        type: file
        path: cad/README.md
        format: code
        operations: { delete: false }

      - name: testing_index
        label: Test log (testing/README.md)
        type: file
        path: testing/README.md
        format: code
        operations: { delete: false }

# ---- Commits ----
settings:
  commit:
    identity: user
    templates:
      create: "Add {path} (via Pages CMS)"
      update: "Update {path} (via Pages CMS)"
      delete: "Delete {path} (via Pages CMS)"
      rename: "Rename {oldPath} to {newPath} (via Pages CMS)"